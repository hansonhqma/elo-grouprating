[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-night-elo"
version = "1.0.0"
description = "Elo-style rating system for a movie club: picks play matches judged by Elo-weighted raters."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
packages = ["movie_elo", "movie_beli"]
